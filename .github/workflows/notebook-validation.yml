name: Notebook validation

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU regression dependencies
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "scikit-learn>=1.5,<2" "librosa>=0.10.2,<1" "soundfile>=0.12,<1" nbformat ipython

      - name: Validate notebook
        run: python scripts/validate_notebook.py

      - name: Run behavioral regression tests
        run: python -m unittest discover -s tests -v
